  var norm=function(s){ return s.trim(); };
  var bytes=function(s){ return Uint8Array.from(atob(s),function(ch){ return ch.charCodeAt(0); }); };
  var f=document.getElementById('f'), msg=document.getElementById('msg'), go=document.getElementById('go');
  async function unlock(pw, quiet){
    if(!window.crypto || !crypto.subtle){ msg.textContent='This browser cannot open the page. Use a current version of Chrome, Edge, Safari or Firefox.'; return; }
    go.disabled=true; if(!quiet) msg.textContent='';
    try{
      var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);

      var html=new TextDecoder().decode(pt);
      document.open(); document.write(html); document.close();
