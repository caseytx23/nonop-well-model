  var norm=function(s){ return s.trim(); };
  var bytes=function(s){ return Uint8Array.from(atob(s),function(ch){ return ch.charCodeAt(0); }); };
  var f=document.getElementById('f'), msg=document.getElementById('msg'), go=document.getElementById('go');
  async function unlock(pw, quiet){
    if(!window.crypto || !crypto.subtle){ msg.textContent='This browser cannot open the page. Use a current version of Chrome, Edge, Safari or Firefox.'; return; }
    go.disabled=true; if(!quiet) msg.textContent='';
    try{
      var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(IV)},key,bytes(DATA));
      try{ sessionStorage.setItem('wi-model-pw',pw); }catch(e){}
      var html=new TextDecoder().decode(pt);
      document.open(); document.write(html); document.close();
    }catch(e){
      try{ sessionStorage.removeItem('wi-model-pw'); }catch(e2){}
      go.disabled=false; if(!quiet) msg.textContent='That password did not work. Check it and try again.';
    }
  }
  f.addEventListener('submit',function(e){ e.preventDefault(); var pw=norm(document.getElementById('pw').value); if(pw) unlock(pw,false); });
  var saved=null; try{ saved=sessionStorage.getItem('wi-model-pw'); }catch(e){}
  if(saved) unlock(saved,true);   // same browser tab: a refresh does not ask again
